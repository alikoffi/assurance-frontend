<div class="assures-page">
	<section class="assures-hero">
		<p class="eyebrow">Clients</p>
		<h1>Assurés</h1>
		<p>Répertoire clients.</p>
	</section>

	<p-message *ngIf="messageErreur" severity="error" styleClass="mb-3">
		{{ messageErreur }}
	</p-message>

	<p-card>
		<p-table
			#dt
			[value]="assures"
			[loading]="chargement"
			[paginator]="true"
			[rows]="10"
			[rowsPerPageOptions]="[10, 20, 50]"
			[globalFilterFields]="['nom', 'prenom', 'telephone', 'ville', 'numeroCarteIdentite']"
			responsiveLayout="scroll"
		>
			<ng-template #caption>
				<div class="table-caption">
					<h2>Liste</h2>
					<p-iconfield>
						<p-inputicon styleClass="pi pi-search"></p-inputicon>
						<input pInputText type="text" placeholder="Rechercher..." (input)="onGlobalFilter(dt, $event)"/>
					</p-iconfield>
				</div>
			</ng-template>
			<ng-template #header>
				<tr>
					<th pSortableColumn="nom">Nom <p-sortIcon field="nom"></p-sortIcon></th>
					<th pSortableColumn="prenom">Prénom <p-sortIcon field="prenom"></p-sortIcon></th>
					<th pSortableColumn="telephone">Téléphone <p-sortIcon field="telephone"></p-sortIcon></th>
					<th pSortableColumn="numeroCarteIdentite">Pièce <p-sortIcon field="numeroCarteIdentite"></p-sortIcon></th>
					<th pSortableColumn="ville">Ville <p-sortIcon field="ville"></p-sortIcon></th>
					<th>Adresse</th>
				</tr>
			</ng-template>
			<ng-template #body let-assure>
				<tr>
					<td>{{ assure.nom }}</td>
					<td>{{ assure.prenom }}</td>
					<td>{{ assure.telephone }}</td>
					<td>{{ assure.numeroCarteIdentite }}</td>
					<td>{{ assure.ville }}</td>
					<td>{{ assure.adresse }}</td>
				</tr>
			</ng-template>
			<ng-template #emptymessage>
				<tr>
					<td colspan="6">Aucun assuré.</td>
				</tr>
			</ng-template>
		</p-table>
	</p-card>
</div>
